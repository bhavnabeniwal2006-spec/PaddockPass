
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up | Paddock Pass</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .signup-box {
            background: #222;
            padding: 35px;
            width: 320px;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            color: #e10600;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }

        button {
            width: 98%;
            padding: 12px;
            background: #e10600;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        a {
            color: #e10600;
            text-decoration: none;
        }

        .message {
            color: #ff7777;
        }
    </style>
</head>

<body>
    <div class="signup-box">
        <h1>PADDOCK PASS</h1>
        <h2>Create Account</h2>

        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="name"
                   placeholder="Your Name" required>

            <input type="email" name="email"
                   placeholder="Email Address" required>

            <input type="password" name="password"
                   placeholder="Password" required>

            <button type="submit">SIGN UP</button>
        </form>

        <p>Already registered? <a href="{{ url_for('login') }}">Login</a></p>
        <p><a href="/">Back to Home</a></p>
    </div>
</body>
</html>
